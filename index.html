<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SiteCheck — ไซต์เช็ค บันทึกผู้รับเหมาเข้าทำงาน</title>
<meta name="description" content="เช็คทีมช่างเข้างานวันละ 3 รอบ แสดง heatmap เก็บรูปหลักฐาน export PDF">
<meta name="theme-color" content="#1d2d3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SiteCheck">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f3;--surface:#e9e9ea;--text:#1d1f20;--accent:#5980a6;--divider:rgba(29,31,32,.16);
--n100:#f5f5f8;--n200:#e7e7ea;--n300:#d4d4d7;--n500:#98989b;--n600:#7a7a7d;--n700:#5d5d60;--n800:#424244;--n900:#2b2b2d;
--a100:#eef6ff;--a200:#d6ebff;--a300:#b5d9fd;--a400:#94bce3;--a500:#749dc4;--a600:#597ea3;--a700:#416180;--a800:#2c455d;--a900:#1d2d3d;
--fh:"Barlow Condensed",system-ui,sans-serif;--fb:"Barlow",system-ui,sans-serif;
--s1:3.4px;--s2:6.8px;--s3:10.2px;--s4:13.6px;--s6:20.4px;--s8:27.2px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.5}
h1,h2,h3,h4,h5{font-family:var(--fh);font-weight:600;line-height:1.12;letter-spacing:-.015em;margin:0}
h2{font-size:32px}h4{font-size:20px}h5{font-size:16px}
button,input{font-family:inherit}
:focus{outline:none}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.tn{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--fh);font-weight:600;font-size:14px;line-height:1.2;color:var(--text);background:transparent;border:1px solid var(--divider);padding:var(--s2) 12px;border-radius:0;min-height:40px}
.btn:hover{background:rgba(29,31,32,.07)}.btn:active{background:rgba(29,31,32,.14)}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn-primary:hover{background:var(--a600)}.btn-primary:active{background:var(--a700)}
.btn-ghost{border-color:transparent;color:var(--accent)}
.btn-ghost:hover{background:rgba(89,128,166,.1)}
.btn-inv{color:var(--bg);border-color:rgba(242,242,243,.28)}
.btn-inv:hover{background:rgba(242,242,243,.1)}
.input{width:100%;min-height:44px;padding:6px 10px;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--divider);border-radius:0;caret-color:var(--accent)}
.input:focus-visible{border-color:var(--accent);outline-offset:0}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:0}
.tag-accent{background:var(--a100);color:var(--a800)}.tag-neutral{background:var(--n100);color:var(--n800)}.tag-outline{border:1px solid var(--accent);color:var(--accent)}
.card{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);background:transparent;border:1px solid var(--divider);border-radius:0;position:relative}
.bp>.c{position:absolute;width:11px;height:11px;color:rgba(29,31,32,.55)}
.bp>.c::before,.bp>.c::after{content:"";position:absolute;background:currentColor}
.bp>.c::before{left:5px;top:0;width:1px;height:100%}.bp>.c::after{top:5px;left:0;width:100%;height:1px}
.bp>.tl{top:-6px;left:-6px}.bp>.tr{top:-6px;right:-6px}.bp>.bl{bottom:-6px;left:-6px}.bp>.br{bottom:-6px;right:-6px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(29,31,32,.6);padding:var(--s2);border-bottom:1px solid var(--divider)}
.table td{padding:var(--s2);border-bottom:1px solid rgba(29,31,32,.08);vertical-align:top}
.kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--n600)}
.wrap{width:100%;max-width:470px;margin:0 auto;min-width:0;padding-bottom:64px}
.hdr{position:sticky;top:0;z-index:20;background:var(--a900);color:var(--bg);padding-top:env(safe-area-inset-top)}
.nav{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4) var(--s2)}
.brand{font-family:var(--fh);font-weight:600;font-size:18px;line-height:1.1;min-width:0}
.brand small{display:block;font-family:var(--fb);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--a300);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:grid;grid-template-columns:repeat(3,7px);gap:2px;flex:none}
.logo i{display:block;width:7px;height:7px;background:var(--bg)}
.logo i.m{background:var(--a400)}.logo i.d{background:var(--a700)}
.teams{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--s4) var(--s3);align-items:center}
.teamchip{display:inline-flex;font-size:12px;border:1px solid rgba(242,242,243,.28);color:var(--bg)}
.teamchip button{border:none;background:transparent;font:inherit;color:inherit;padding:6px 8px 6px 10px;cursor:pointer;min-height:32px}
.teamchip button.x{border-left:1px solid rgba(242,242,243,.28);color:var(--a300);padding:6px 9px}
.main{padding:var(--s6) var(--s4) 0}
.slot{border-top:1px solid var(--divider);padding:var(--s4)}
.slothead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.slottime{font-family:var(--fh);font-size:22px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.grid2 .btn{min-height:46px;font-size:15px}
.cnt{display:flex;align-items:center;gap:var(--s2)}
.cnt .btn{width:44px;min-height:44px;font-size:18px;padding:0}
.cnt .num{font-family:var(--fh);font-size:24px;min-width:40px;text-align:center}
.photos{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.ph{position:relative;width:66px;height:66px;border:1px solid var(--divider)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:0;right:0;width:22px;height:22px;border:none;background:var(--n900);color:var(--bg);cursor:pointer;font-size:12px;line-height:1;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:10px;letter-spacing:.06em;color:var(--n600)}
.day{position:relative;aspect-ratio:1/1;min-width:0;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--divider);border-radius:0;background:transparent;cursor:pointer;font-family:var(--fh);font-size:14px;color:var(--n700)}
.day.fut{border-style:dashed;opacity:.6;color:var(--n500);cursor:default}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.day.today{font-weight:700}
.day.l1{background:var(--a200);color:var(--a900)}.day.l2{background:var(--a400);color:var(--a900)}.day.l3{background:var(--a800);color:var(--bg)}
.day.none{background:var(--n300)}
.day .mk{position:absolute;top:2px;left:3px;font-size:9px;line-height:1}
.day .dot{position:absolute;bottom:3px;right:3px;width:4px;height:4px;background:var(--a700)}
.day.l3 .dot{background:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);padding-top:var(--s2);border-top:1px solid var(--divider);font-size:11px;color:var(--n700)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border:1px solid var(--divider);display:flex;align-items:center;justify-content:center;font-size:8px;font-style:normal}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4);margin-top:var(--s4);padding:0 var(--s1)}
.stat .v{font-family:var(--fh);font-size:26px;line-height:1.15}
.stat .l{font-size:11px;color:var(--n700)}.stat .s{font-size:10.5px;color:var(--n600)}
.foot{border-top:1px solid var(--divider);padding:var(--s2) var(--s3);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--n600)}
.light{position:fixed;inset:0;z-index:60;background:rgba(43,43,45,.6);display:grid;place-items:center;padding:var(--s4);cursor:zoom-out}
.light img{max-width:100%;max-height:88vh;border:1px solid var(--divider)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--a900);color:var(--bg);padding:10px 16px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* report */
.rep{min-height:100vh;background:var(--n200)}
.repbar{position:sticky;top:0;z-index:20;background:var(--a900);padding:var(--s3) var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:space-between;color:var(--bg);font-size:13px}
.paper{max-width:840px;margin:0 auto;padding:var(--s6) var(--s4) var(--s8)}
.sheet{background:#fff;padding:var(--s8) var(--s8) 40px}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s6);border-bottom:2px solid var(--text);padding-bottom:var(--s3)}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--divider);border:1px solid var(--divider);margin-top:var(--s6)}
.rstats>div{background:#fff;padding:var(--s3)}
.rstats .v{font-family:var(--fh);font-size:24px;line-height:1.2}
.rcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rcal .day{font-size:13px;cursor:default}
.ev{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);padding:var(--s1)}
.ev figure{margin:0;border:1px solid var(--divider);position:relative}
.ev img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ev figcaption{display:flex;justify-content:space-between;padding:4px 6px;font-size:11px;color:var(--n700)}
.sign{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:48px;font-size:11px;color:var(--n700)}
.sign div>div{border-bottom:1px solid var(--n500);height:46px;margin-bottom:6px}
@page{margin:14mm}
@media print{body{background:#fff}.noprint{display:none!important}.pg{break-inside:avoid}.pgbreak{break-before:page}.rep{background:#fff}.paper{padding:0;max-width:none}.sheet{padding:0;zoom:.82}.sheet .pgbreak{zoom:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
var TIMES=['09:00','13:00','17:00'],HOURS=[9,13,17],LS='sitecheck.v1',NONE='__none';
var TH_MONTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var DOW=['จ','อ','พ','พฤ','ศ','ส','อา'];
var CORNERS='<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>';
function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stamp(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}

var data=null;
try{data=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
if(!data||!Array.isArray(data.contractors)||!data.contractors.length){
  data={project:'ไซต์เช็ค — บันทึกผู้รับเหมาเข้าทำงาน',contractors:[{id:'c1',name:'ทีมช่างเบีย'},{id:'c2',name:'ทีมช่างจอย'}],entries:{}};
}
if(!data.project||data.project==='ไซต์งาน — บันทึกผู้รับเหมา')data.project='ไซต์เช็ค — บันทึกผู้รับเหมาเข้าทำงาน';
var t0=new Date();
var S={y:t0.getFullYear(),m:t0.getMonth(),sel:dkey(t0),view:'app',light:null,withPhotos:true,remind:false,fired:{}};

function save(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){toast('พื้นที่เก็บข้อมูลเต็ม — ลบรูปเก่าหรือ export backup')}}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2600)}
function name(id){for(var i=0;i<data.contractors.length;i++)if(data.contractors[i].id===id)return data.contractors[i].name;return''}
function getDay(dk){return data.entries[dk]||[null,null,null]}
function isLocked(dk){return dk>dkey(new Date())}
function writeDay(dk,arr){if(isLocked(dk))return;var empty=true;for(var i=0;i<3;i++)if(arr[i])empty=false;if(empty)delete data.entries[dk];else data.entries[dk]=arr;save();render()}
function mutSlot(i,fn){var cur=getDay(S.sel).slice();var x=cur[i];var sl=x?{teams:(x.teams||[]).slice(),n:Object.assign({},x.n||{}),note:x.note||'',photos:(x.photos||[]).slice(),at:x.at||''}:{teams:[],n:{},note:'',photos:[],at:''};var keep=fn(sl);cur[i]=keep===false?null:sl;writeDay(S.sel,cur)}

// ---------- actions ----------
var A={
  toggleTeam:function(i,id){mutSlot(i,function(sl){
    if(id===NONE){if(sl.teams.length===0&&sl.at)return !!(sl.note||sl.photos.length);sl.teams=[];sl.n={};sl.at=stamp();return true}
    var k=sl.teams.indexOf(id);
    if(k>=0){sl.teams.splice(k,1);delete sl.n[id];if(!sl.teams.length&&!sl.note&&!sl.photos.length)return false}
    else sl.teams.push(id);
    sl.at=stamp();return true})},
  inc:function(i,id){mutSlot(i,function(sl){sl.n[id]=Math.min(99,(sl.n[id]||0)+1)})},
  dec:function(i,id){mutSlot(i,function(sl){var v=(sl.n[id]||0)-1;if(v<=0)delete sl.n[id];else sl.n[id]=v})},
  note:function(i,v){var cur=getDay(S.sel).slice();if(!cur[i])return;cur[i]=Object.assign({},cur[i],{note:v});data.entries[S.sel]=cur;save()},
  photos:function(i,files){Array.prototype.slice.call(files,0,6).forEach(function(f){var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){
    var sc=Math.min(1,640/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    var d=new Date(),sd=parseKey(S.sel),txt=pad(sd.getDate())+'/'+pad(sd.getMonth()+1)+'/'+(sd.getFullYear()+543)+'  '+pad(d.getHours())+':'+pad(d.getMinutes())+'  รอบ '+TIMES[i];
    var fs=Math.max(12,Math.round(c.width/28));x.font='600 '+fs+'px "Barlow Condensed",system-ui,sans-serif';var w=x.measureText(txt).width+fs*1.2,bh=fs*1.9;
    x.fillStyle='rgba(29,45,61,.78)';x.fillRect(c.width-w,c.height-bh,w,bh);x.fillStyle='#f2f2f3';x.textBaseline='middle';x.fillText(txt,c.width-w+fs*.6,c.height-bh/2);
    var src;try{src=c.toDataURL('image/jpeg',.55)}catch(e){src=fr.result}mutSlot(i,function(sl){sl.photos.push(src);if(!sl.at)sl.at=stamp()})};img.src=fr.result};fr.readAsDataURL(f)})},
  delPhoto:function(i,pi){mutSlot(i,function(sl){sl.photos.splice(pi,1)})},
  clearDay:function(){if(confirm('ล้างบันทึกของวันนี้?'))writeDay(S.sel,[null,null,null])},
  pickDay:function(k){if(k){S.sel=k;render()}},
  prev:function(){S.m--;if(S.m<0){S.m=11;S.y--}render()},
  next:function(){S.m++;if(S.m>11){S.m=0;S.y++}render()},
  today:function(){var t=new Date();S.y=t.getFullYear();S.m=t.getMonth();S.sel=dkey(t);render()},
  rename:function(id){var v=prompt('ชื่อทีม / ช่าง',name(id));if(!v)return;data.contractors.forEach(function(c){if(c.id===id)c.name=v});save();render()},
  add:function(){var v=prompt('ชื่อทีม / ช่างใหม่','');if(!v)return;data.contractors.push({id:'c'+Date.now(),name:v});save();render()},
  del:function(id){if(data.contractors.length<=1){alert('ต้องเหลืออย่างน้อย 1 ทีม');return}if(!confirm('ลบ "'+name(id)+'"? บันทึกเก่าจะยังอยู่'))return;data.contractors=data.contractors.filter(function(c){return c.id!==id});save();render()},
  project:function(){var v=prompt('ชื่อไซต์งาน / โครงการ',data.project);if(!v)return;data.project=v;save();render()},
  remind:function(){S.remind=!S.remind;if(S.remind&&window.Notification&&Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}render()},
  report:function(){S.view='report';window.scrollTo(0,0);render()},
  back:function(){S.view='app';render()},
  print:function(){window.print()},
  share:function(){
    var btn=document.querySelector('[data-act="share"]');if(btn){btn.disabled=true;btn.textContent='กำลังสร้าง PDF…'}
    var sheet=document.querySelector('.sheet'),ev=sheet.querySelector('.pgbreak');
    loadLibs().then(function(){
      if(ev)ev.style.display='none';
      return html2canvas(sheet,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    }).then(function(cv){
      if(ev)ev.style.display='';
      var pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});var pw=210,ph=297,m=12,iw=pw-m*2,ih=ph-m*2;
      // page 1: whole summary scaled to fit one A4
      var s=Math.min(iw/cv.width,ih/cv.height),w=cv.width*s,hh=cv.height*s;
      pdf.addImage(cv.toDataURL('image/jpeg',.88),'JPEG',(pw-w)/2,m,w,hh);
      if(!ev)return pdf;
      // following pages: photo appendix
      return html2canvas(ev,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(ec){
        var ratio=ec.width/iw,pageH=ih*ratio,y=0;
        while(y<ec.height){var sh=Math.min(pageH,ec.height-y);var pc=document.createElement('canvas');pc.width=ec.width;pc.height=sh;pc.getContext('2d').drawImage(ec,0,y,ec.width,sh,0,0,ec.width,sh);
          pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.82),'JPEG',m,m,iw,sh/ratio);y+=sh}
        return pdf});
    }).then(function(pdf){
      var fname='SiteCheck-'+S.y+'-'+pad(S.m+1)+'.pdf',blob=pdf.output('blob'),file=new File([blob],fname,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:'รายงานเข้างาน '+monthLabel()}).catch(function(){});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('ดาวน์โหลด PDF แล้ว — ส่งต่อทาง LINE ได้');
    }).catch(function(){if(ev)ev.style.display='';toast('สร้าง PDF ไม่สำเร็จ — ต้องต่ออินเทอร์เน็ตครั้งแรก')}).then(function(){if(btn){btn.disabled=false;btn.textContent='แชร์ PDF (LINE)'}});
  },
  togglePhotos:function(){S.withPhotos=!S.withPhotos;render()},
  light:function(src){S.light=src;render()},
  unlight:function(){S.light=null;render()},
  exportJson:function(){var blob=new Blob([JSON.stringify(data)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sitecheck-backup-'+dkey(new Date())+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)},
  importJson:function(files){var f=files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.contractors))throw 0;if(!confirm('นำเข้าข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันจะถูกแทนที่'))return;data=d;if(!data.entries)data.entries={};if(!data.project||data.project==='ไซต์งาน — บันทึกผู้รับเหมา')data.project='ไซต์เช็ค — บันทึกผู้รับเหมาเข้าทำงาน';save();render();toast('นำเข้าข้อมูลแล้ว')}catch(e){alert('ไฟล์ไม่ถูกต้อง')}};fr.readAsText(f)}
};

// ---------- compute ----------
function compute(){
  var todayKey=dkey(new Date()),nowH=new Date().getHours();
  var first=new Date(S.y,S.m,1),shift=(first.getDay()+6)%7,dim=new Date(S.y,S.m+1,0).getDate(),cells=Math.ceil((shift+dim)/7)*7;
  var mpref=S.y+'-'+pad(S.m+1)+'-';
  var recorded=Object.keys(data.entries).filter(function(k){return k.indexOf(mpref)===0}).sort();
  var startKey=recorded.length?recorded[0]:null;
  var inN=0,outN=0,blankN=0,photoN=0,fullDays=0,ts={};
  data.contractors.forEach(function(t){ts[t.id]={days:0,rounds:0}});
  var days=[];
  for(var i=0;i<cells;i++){
    var dnum=i-shift+1;
    if(dnum<1||dnum>dim){days.push(null);continue}
    var k=mpref+pad(dnum),arr=getDay(k),future=k>todayKey;
    var rounds=0,outs=0,set={},hasPhoto=false;
    arr.forEach(function(x){if(!x)return;if(x.teams.length)rounds++;else outs++;x.teams.forEach(function(id){set[id]=1});if((x.photos||[]).length)hasPhoto=true});
    var tc=Object.keys(set).length,lvl=Math.min(3,tc);
    if(!future){
      if(rounds>0)inN++;else if(outs>0)outN++;else if(startKey&&k>=startKey&&k<todayKey)blankN++;
      if(rounds===3)fullDays++;
      arr.forEach(function(x){if(x)photoN+=(x.photos||[]).length});
      data.contractors.forEach(function(t){var r=0;arr.forEach(function(x){if(x&&x.teams.indexOf(t.id)>=0)r++});if(r){ts[t.id].days++;ts[t.id].rounds+=r}});
    }
    days.push({key:k,num:dnum,future:future,lvl:lvl,none:tc===0&&outs>0,sel:S.sel===k,today:k===todayKey,photo:hasPhoto});
  }
  var totalDue=inN+outN+blankN,pct=totalDue?Math.round(inN/totalDue*100):0;
  var stats=[
    {l:'วันที่มีทีมเข้างาน',v:inN,s:'จาก '+totalDue+' วัน นับจากวันแรกที่บันทึก',c:'var(--a700)'},
    {l:'วันที่ไม่มีใครเข้า',v:outN,s:'วัน',c:'var(--text)'},
    {l:'วันที่ยังไม่บันทึก',v:blankN,s:'วัน',c:'var(--n600)'},
    {l:'อัตราเข้างาน',v:pct+'%',s:fullDays+' วันที่มีคนครบ 3 รอบ',c:'var(--text)'}];
  var teamStats=data.contractors.map(function(t){return{name:t.name,days:ts[t.id].days,rounds:ts[t.id].rounds}});
  var rows=[],evidence=[];
  recorded.forEach(function(dk){var arr=getDay(dk),d=parseKey(dk),label=pad(d.getDate())+'/'+pad(S.m+1);
    var cell=function(x){return !x?'—':(x.teams.length?x.teams.map(name).filter(Boolean).join(', '):'ไม่มีใครเข้า')};
    rows.push({date:label,s:[cell(arr[0]),cell(arr[1]),cell(arr[2])],note:arr.map(function(x,i){return x&&x.note?TIMES[i]+' '+x.note:''}).filter(Boolean).join(' · ')||'—'});
    arr.forEach(function(x,i){((x&&x.photos)||[]).forEach(function(src){evidence.push({src:src,date:label,time:TIMES[i]})})})});
  return{todayKey:todayKey,nowH:nowH,days:days,stats:stats,teamStats:teamStats,rows:rows,evidence:evidence,photoN:photoN};
}

// ---------- render ----------
function render(){
  var C=compute(),app=document.getElementById('app');
  app.innerHTML=S.view==='report'?renderReport(C):renderApp(C);
  if(S.light)app.insertAdjacentHTML('beforeend','<div class="light" data-act="unlight"><img src="'+S.light+'" alt="หลักฐาน"></div>');
}
function monthLabel(){return TH_MONTH[S.m]+' '+(S.y+543)}
function calHTML(C,cls){
  var h='<div class="'+cls+'">'+DOW.map(function(d){return'<div class="dow">'+d+'</div>'}).join('')+'</div><div class="'+cls+'" style="margin-top:4px">';
  C.days.forEach(function(d){
    if(!d){h+='<div></div>';return}
    var c='day'+(d.future?' fut':'')+(d.sel&&cls==='cal'?' sel':'')+(d.today?' today':'')+(!d.future&&d.none?' none':(!d.future&&d.lvl?' l'+d.lvl:''));
    h+='<button class="'+c+'" data-act="pickDay" data-k="'+(d.future?'':d.key)+'"><span class="tn">'+d.num+'</span>'+(d.none&&!d.future?'<span class="mk">✕</span>':'')+(d.photo?'<span class="dot"></span>':'')+'</button>';
  });
  return h+'</div>';
}
function legendHTML(){
  return'<div class="legend"><span><i></i>ไม่ได้บันทึก</span><span><i style="background:var(--a200)"></i>1 ทีม</span><span><i style="background:var(--a400)"></i>2 ทีม</span><span><i style="background:var(--a800)"></i>3+ ทีม</span><span><i style="background:var(--n300)">✕</i>ไม่มีใครเข้า</span></div>';
}
function renderApp(C){
  var selArr=getDay(S.sel),selD=parseKey(S.sel),locked=isLocked(S.sel),isToday=S.sel===C.todayKey,selFuture=S.sel>C.todayKey;
  var daySet={};selArr.forEach(function(x){if(x)x.teams.forEach(function(id){daySet[id]=1})});
  var h='<div class="wrap"><div class="hdr"><div class="nav">'+
    '<div style="display:flex;align-items:center;gap:var(--s3);margin-right:auto;min-width:0"><span class="logo"><i></i><i class="m"></i><i></i><i class="m"></i><i></i><i class="d"></i><i></i><i></i><i class="m"></i></span>'+
    '<div class="brand">SiteCheck<small data-act="project" style="cursor:pointer" title="แตะเพื่อเปลี่ยนชื่อไซต์">'+esc(data.project)+'</small></div></div>'+
    '<button class="btn btn-inv" data-act="remind" title="แจ้งเตือนรอบตรวจ" style="min-width:40px;color:'+(S.remind?'var(--a300)':'var(--bg)')+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>'+
    '<button class="btn btn-primary" data-act="report">รายงาน</button></div>'+
    '<div class="teams"><span style="font-size:11px;color:var(--a300);letter-spacing:.08em;text-transform:uppercase">ทีม</span>'+
    data.contractors.map(function(t){return'<span class="teamchip"><button data-act="rename" data-id="'+t.id+'" title="แตะเพื่อเปลี่ยนชื่อ">'+esc(t.name)+'</button><button class="x" data-act="del" data-id="'+t.id+'" title="ลบทีม">×</button></span>'}).join('')+
    '<button class="btn btn-ghost" data-act="add" style="font-size:12px;min-height:32px;color:var(--a300)">+ เพิ่มทีม</button></div>'+
    (S.remind?'<div style="padding:0 var(--s4) var(--s3);font-size:11px;color:var(--a300)">แจ้งเตือนเปิดอยู่ — เตือน 09:00 / 13:00 / 17:00 เฉพาะตอนเปิดแอปไว้</div>':'')+
    '</div><div class="main">';
  // day card
  h+='<div class="card bp" style="gap:0;padding:0">'+CORNERS+
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);padding:var(--s4)"><div><div class="kicker">'+(isToday?'บันทึกวันนี้':(selFuture?'วันข้างหน้า':'บันทึกย้อนหลัง'))+'</div><h4 style="margin-top:2px">'+selD.getDate()+' '+TH_MONTH[selD.getMonth()]+' '+(selD.getFullYear()+543)+'</h4></div>'+
    '<div style="text-align:right"><div class="tn" style="font-family:var(--fh);font-size:30px;line-height:1">'+(Object.keys(daySet).length||'—')+'</div><div style="font-size:11px;color:var(--a700)">ทีมที่เข้าวันนี้</div></div></div>';
  TIMES.forEach(function(t,i){
    var x=selArr[i],on=x?x.teams:[],recNone=!!x&&!on.length&&!!x.at;
    var due=S.sel<C.todayKey||(isToday&&C.nowH>=HOURS[i]);
    var chip=on.length?on.length+' ทีม':(recNone?'ไม่มีใครเข้า':(selFuture?'ยังไม่ถึง':(due?'ไม่ได้บันทึก':'รอเวลา')));
    var chipCls=on.length?'tag-accent':(recNone?'tag-outline':'tag-neutral');
    h+='<div class="slot"><div class="slothead"><span class="slottime tn">'+t+'</span><span class="tag '+chipCls+'">'+chip+'</span><span class="tn muted" style="margin-left:auto;font-size:11px">'+(x&&x.at?'บันทึก '+x.at:'')+'</span></div>';
    if(!locked){
      h+='<div class="grid2">'+data.contractors.map(function(tm){var act=on.indexOf(tm.id)>=0;return'<button class="btn '+(act?'btn-primary':'')+'" data-act="toggleTeam" data-i="'+i+'" data-id="'+tm.id+'">'+esc(tm.name)+'</button>'}).join('')+
        '<button class="btn" data-act="toggleTeam" data-i="'+i+'" data-id="'+NONE+'" style="color:'+(recNone?'var(--text)':'var(--n600)')+'">ไม่มีใครเข้า</button></div>';
      if(on.length){
        h+='<div style="margin-top:var(--s3);display:flex;flex-direction:column;gap:var(--s2)">';
        on.forEach(function(id){h+='<div class="cnt"><span style="font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(name(id))+' <span class="muted">· คน</span></span><button class="btn" data-act="dec" data-i="'+i+'" data-id="'+id+'">−</button><span class="num tn">'+((x.n&&x.n[id])||'—')+'</span><button class="btn" data-act="inc" data-i="'+i+'" data-id="'+id+'">+</button></div>'});
        h+='<div style="display:flex;gap:var(--s2)"><input class="input" data-note="'+i+'" value="'+esc(x.note||'')+'" placeholder="หมายเหตุ เช่น งานที่ทำ" style="flex:1;min-width:0"><label class="btn" style="white-space:nowrap;cursor:pointer;min-height:44px">รูป<input type="file" accept="image/*" capture="environment" multiple data-photo="'+i+'" style="display:none"></label></div></div>';
      }
    } else if(on.length||recNone||(x&&x.note)){
      h+='<div style="font-size:12.5px;color:var(--n700)">'+esc([on.length?on.map(name).join(', '):(recNone?'ไม่มีใครเข้า':''),x&&x.note].filter(Boolean).join(' — '))+'</div>';
    }
    if(x&&(x.photos||[]).length){h+='<div class="photos">'+x.photos.map(function(src,pi){return'<div class="ph"><img src="'+src+'" data-act="light" alt="หลักฐาน">'+(locked?'':'<button data-act="delPhoto" data-i="'+i+'" data-pi="'+pi+'">×</button>')+'</div>'}).join('')+'</div>'}
    h+='</div>';
  });
  h+='<div class="foot"><span>'+(locked?'บันทึกได้เมื่อถึงวัน':'แตะชื่อทีมที่เข้างานในแต่ละรอบ · เก็บข้อมูลในเครื่องนี้')+'</span>'+(locked?'':'<button class="btn btn-ghost" data-act="clearDay" style="font-size:12px;min-height:32px">ล้างบันทึกวันนี้</button>')+'</div></div>';
  // calendar
  h+='<div style="display:flex;align-items:center;gap:var(--s2);margin:var(--s8) 0 var(--s3)"><button class="btn" data-act="prev" style="width:40px">‹</button><h4 style="flex:1;text-align:center">'+monthLabel()+'</h4><button class="btn" data-act="next" style="width:40px">›</button><button class="btn" data-act="today">วันนี้</button></div>';
  h+='<div class="card bp" style="gap:var(--s3)">'+CORNERS+calHTML(C,'cal')+legendHTML()+'</div>';
  // stats
  var all=C.stats.concat(C.teamStats.map(function(t){return{l:t.name,v:t.days,s:'วันที่เข้างาน · '+t.rounds+' รอบ',c:'var(--a700)'}}),[{l:'รูปหลักฐาน',v:C.photoN,s:'ไฟล์ในเดือนนี้',c:'var(--text)'}]);
  h+='<div class="stats">'+all.map(function(s){return'<div class="card bp stat" style="gap:0">'+CORNERS+'<div class="l">'+esc(s.l)+'</div><div class="v tn" style="color:'+s.c+'">'+esc(s.v)+'</div><div class="s">'+esc(s.s)+'</div></div>'}).join('')+'</div>';
  // backup
  h+='<div style="margin-top:var(--s8);display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center"><span style="font-size:11px;color:var(--n600);flex:1">สำรองข้อมูล (JSON)</span><button class="btn" data-act="exportJson">Export backup</button><label class="btn" style="cursor:pointer">Import<input type="file" accept="application/json,.json" data-import style="display:none"></label></div>';
  return h+'</div></div>';
}
function renderReport(C){
  var now=new Date();
  var h='<div class="rep"><div class="repbar noprint"><div>'+monthLabel()+'</div><div style="display:flex;gap:var(--s2)"><button class="btn btn-inv" data-act="togglePhotos">'+(S.withPhotos?'ซ่อนรูปหลักฐาน':'แนบรูปหลักฐาน')+'</button><button class="btn btn-inv" data-act="back">กลับ</button><button class="btn btn-inv" data-act="print">พิมพ์ / PDF</button><button class="btn btn-primary" data-act="share">แชร์ PDF (LINE)</button></div></div>';
  h+='<div class="paper"><div class="sheet"><div class="rhead pg"><div><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--a700)">SiteCheck · สรุปการเข้างานรายเดือน</div><h2 style="margin-top:4px">'+esc(data.project)+'</h2><div style="font-size:15px;color:var(--n800)">'+monthLabel()+' · '+esc(data.contractors.map(function(c){return c.name}).join(', '))+'</div></div>'+
    '<div class="tn" style="text-align:right;font-size:11px;color:var(--n700);line-height:1.8"><div>ออกรายงาน '+now.getDate()+'/'+pad(now.getMonth()+1)+'/'+(now.getFullYear()+543)+' '+pad(now.getHours())+':'+pad(now.getMinutes())+'</div><div>รอบตรวจ 09:00 / 13:00 / 17:00</div></div></div>';
  h+='<div class="rstats bp pg">'+CORNERS+C.stats.map(function(s){return'<div><div style="font-size:10.5px;color:var(--n700)">'+esc(s.l)+'</div><div class="v tn" style="color:'+s.c+'">'+esc(s.v)+'</div><div style="font-size:10px;color:var(--n600)">'+esc(s.s)+'</div></div>'}).join('')+'</div>';
  h+='<div class="pg" style="margin-top:var(--s8)"><h5 style="margin-bottom:var(--s2)">วันเข้างานแยกตามทีม</h5><table class="table"><thead><tr><th>ทีม</th><th>วันที่เข้างาน</th></tr></thead><tbody>'+C.teamStats.map(function(t){return'<tr><td>'+esc(t.name)+'</td><td class="tn">'+t.days+'</td></tr>'}).join('')+'</tbody></table></div>';
  h+='<div class="pg" style="margin-top:var(--s8)"><h5 style="margin-bottom:var(--s3)">ปฏิทินความสม่ำเสมอ</h5>'+calHTML(C,'rcal')+'<div style="margin-top:var(--s3)">'+legendHTML().replace('class="legend"','class="legend" style="border:0;padding:0"')+'</div></div>';
  h+='<div style="margin-top:var(--s8)"><h5 style="margin-bottom:var(--s2)">บันทึกรายวัน</h5>';
  if(C.rows.length){h+='<table class="table"><thead><tr><th>วันที่</th><th>09:00</th><th>13:00</th><th>17:00</th><th>หมายเหตุ</th></tr></thead><tbody>'+C.rows.map(function(r){return'<tr><td class="tn">'+r.date+'</td><td style="font-size:12.5px">'+esc(r.s[0])+'</td><td style="font-size:12.5px">'+esc(r.s[1])+'</td><td style="font-size:12.5px">'+esc(r.s[2])+'</td><td style="font-size:12px;color:var(--n700)">'+esc(r.note)+'</td></tr>'}).join('')+'</tbody></table>'}
  else h+='<div style="padding:var(--s6);text-align:center;font-size:12px;color:var(--n600);border:1px dashed var(--divider)">ยังไม่มีบันทึกในเดือนนี้</div>';
  h+='</div>';
  if(S.withPhotos&&C.evidence.length){h+='<div class="pgbreak" style="margin-top:var(--s8)"><h5 style="margin-bottom:var(--s3)">ภาคผนวก · รูปหลักฐาน</h5><div class="ev">'+C.evidence.map(function(e){return'<figure class="bp pg">'+CORNERS+'<img src="'+e.src+'" alt="หลักฐาน"><figcaption class="tn"><span>'+e.date+'</span><span>'+e.time+'</span></figcaption></figure>'}).join('')+'</div></div>'}
  h+='<div class="sign pg"><div><div></div>เจ้าของบ้าน</div><div><div></div>ตัวแทนผู้รับเหมา — ยืนยันข้อมูล</div></div>';
  return h+'</div></div></div>';
}

// ---------- events ----------
function loadLibs(){
  if(window.html2canvas&&window.jspdf)return Promise.resolve();
  var load=function(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})};
  return load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(function(){return load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')});
}
var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),d=el.dataset;
  switch(act){
    case 'toggleTeam':A.toggleTeam(+d.i,d.id);break;
    case 'inc':A.inc(+d.i,d.id);break;
    case 'dec':A.dec(+d.i,d.id);break;
    case 'delPhoto':A.delPhoto(+d.i,+d.pi);break;
    case 'pickDay':A.pickDay(d.k);break;
    case 'rename':A.rename(d.id);break;
    case 'del':A.del(d.id);break;
    case 'light':A.light(el.getAttribute('src'));break;
    default:if(A[act])A[act]();
  }
});
app.addEventListener('input',function(e){var n=e.target.getAttribute('data-note');if(n!=null)A.note(+n,e.target.value)});
app.addEventListener('change',function(e){
  var p=e.target.getAttribute('data-photo');if(p!=null){A.photos(+p,e.target.files);e.target.value='';return}
  if(e.target.hasAttribute('data-import')){A.importJson(e.target.files);e.target.value=''}
});
// reminders (only while the app is open)
setInterval(function(){
  if(!S.remind)return;var d=new Date(),h=d.getHours(),idx=HOURS.indexOf(h);
  if(idx<0||d.getMinutes()>9)return;var tag=dkey(d)+'|'+h;
  if(S.fired[tag]||getDay(dkey(d))[idx])return;S.fired[tag]=1;
  try{if(window.Notification&&Notification.permission==='granted')new Notification('ถึงรอบตรวจ '+TIMES[idx],{body:'บันทึกทีมที่เข้างาน'})}catch(e){}
  toast('ถึงรอบตรวจ '+TIMES[idx]);
},60000);
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
